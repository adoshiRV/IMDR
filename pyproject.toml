[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imdr"
version = "0.1.0"
description = "Industry Market Data Repository — scalable data platform for FX, credit, rates, macro, and more"
requires-python = ">=3.11"
dependencies = [
    # --- DB / SQL ---
    "sqlalchemy>=2.0",
    "pyodbc>=5.1",                # MS SQL Server ODBC driver

    # --- Data ---
    "pandas>=2.2",
    "polars>=1.0",                # high-perf DataFrame ops
    "pyarrow>=17.0",              # columnar interchange

    # --- Config / Env ---
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",

    # --- HTTP ---
    "httpx>=0.27",
    "requests>=2.31",             # BidFX extractor (thread-local sessions)

    # --- Holidays / Calendar ---
    "holidays>=0.40",

    # --- Logging / Observability ---
    "structlog>=24.0",

    # --- Templating ---
    "jinja2>=3.1",

    # --- Scheduling (optional, uncomment when needed) ---
    # "apscheduler>=3.10",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",               # Outlook COM automation for email
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
