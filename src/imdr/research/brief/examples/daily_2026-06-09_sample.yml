    section_num: "§2"
    title: "CN May Trade — Tue 08:30 UTC"
    lead: |
      <strong>AI semis cycle the dominant driver.</strong> Banks split on durability — BNP/JPM see
      structural reflation through energy-chems + non-ferrous + AI (~30% PPI basket); Barclays
      warns "lower and bifurcated" — top-line lift hides domestic-demand weakness.
    table_headers: ["Print", "Forecast", "Vendor drivers"]
    table_rows:
      - ["May Exports y/y", "+14 to +16%", "AI semiconductors cycle (MS 4605, Barclays, Nomura, JPM)"]
      - ["May Imports y/y", "+21 to +26%", "Semis demand · crude vol −47% (Iran)"]
