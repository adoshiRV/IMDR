  - { label: "USD/KRW", value: "1534",   change: "+0.0%",  change_sign: "flat", context: "into KR GDP" }
  - { label: "UST 10y", value: "4.46%",  change: "−0 bp",  change_sign: "flat", context: "blackout" }
