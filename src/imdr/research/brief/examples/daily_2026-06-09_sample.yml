# Sample daily brief config — 2026-06-09 (Monday pre-open)
# Lighter than the weekly: 1-2 prints today + yesterday recap + 2-3 trades.
# Reuses the same components (KPI mini-table, event calendar, vendor cards,
# reaction matrices) — just sized for a 3-6 page skim before market open.

brief_type: daily
period_date: 2026-06-09
title: "Daily Macro Brief · 9 Jun 2026"
subtitle_html: |
  <strong>Tue 9 Jun · Asia open.</strong>
  CN May trade balance at 08:30 UTC — first read on AI semis cycle (consensus exports +14-16% y/y).
  KR Q1 GDP prelim at 07:00. US NFIB small biz optimism 18:00 (Warsh-watch).
  Mon's JP Q1 GDP revised to +1.8% q/q SAAR (capex −2.8%) — confirmed no derail for BoJ Jun hike.

story_callout: |
  <strong>Pre-open setup.</strong> Asia leads with CN trade — banks position long CSI 500/1000 on
  reflation thesis. KRW already at 1534 going into KR GDP. JP confirmed Mon — BoJ Jun hike intact.
  US calendar light today; focus shifts to Wed CPI + BoC. Iran/Hormuz still bid; WTI $94.

