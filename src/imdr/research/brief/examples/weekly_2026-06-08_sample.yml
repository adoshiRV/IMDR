brief_type: weekly
period_date: 2026-06-08
title: "Week of 8–14 June 2026"
subtitle_html: |
  <strong>Three central-bank decisions in 28 hours.</strong> ECB hikes Thu (10/10 consensus) ·
  BoC holds Wed · US May CPI between them · BoJ June hike telegraphed (10/10).
  Compiled from <strong>15 vendors · ~2,400 reports indexed last 7 days</strong>.

story_callout: |
  <strong>The G3 central-bank rotation has flipped.</strong>
  ECB hikes Thu in what every vendor calls "recalibration" not "new cycle".
  BoJ June hike telegraphed unanimously for next week. BoC holds with USMCA tail.
  Iran/Hormuz keeps Brent elevated $94-95/bbl, with banks raising '26 oil
  assumptions +16-40% vs March staff baselines. Fed under Warsh enters comms
  blackout 06/06-06/11.

