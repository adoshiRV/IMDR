# ---------------- Deep dives ----------------
deep_dives:
  - section_id: uscpi
    section_num: "§3"
    title: "US May CPI — Wed 10 Jun 20:30 UTC"
    label: "DEEP DIVE"
    lead: |
      <strong>The print everyone is positioning ahead of.</strong> Consensus median sits at
      <strong>0.50% headline / 0.22% core m/m</strong>. But dispersion is wide: UBS / Nomura camp
      at 0.17-0.18% core vs BNP "Energized" at 0.29% — 12 bp spread on the core call.
    consensus_number: "0.22"
    consensus_text: |
      <strong>Core m/m median forecast across 6 banks.</strong>
      Soft camp (UBS, Nomura) → bull-steepener via SFRZ flatteners.
      Hot camp (BNP solo) → bear-flattener.
    forecast_table_headers: ["Bank", "Hd m/m", "Hd y/y", "Core m/m", "Core y/y", "Tilt"]
    forecast_table_rows:
      - ["BNP 3572",   "0.56", "4.3",  "0.29", "2.9", "Hot tail — \"Energized\""]
      - ["Nomura 4694","0.45", "4.20", "0.18", "2.80","Soft camp"]
      - ["MS 4614",    "0.56", "4.3",  "0.22", "2.8", "Core decelerates"]
    vendor_cards:
      - bank: "BNP Paribas"
        report_id: 3572
        thesis: "\"Energized\" — the lone hot tail at 0.29% core."
        forecast: "Hd 0.56 / 4.3 · Core 0.29 / 2.9 · Motor fuel +7.0 · Airfares +4.0"
        quotes:
          - text: "Inflation persistence, combined with the energy price shock and layered onto ongoing tariff pass-through, suggests that this category will be an inflationary source through our forecast horizon."
        risk: "With summer travel and events impending and the Middle East conflict ongoing, we continue to see upside risks to our inflation profile."
      - bank: "Morgan Stanley"
        report_id: 4614
        thesis: "Maintain SFRZ6M7 flatteners into soft May CPI — peak inflation in rearview."
        forecast: "Core 0.22% m/m (down from 0.38% Apr)"
        quotes:
          - text: "Our economists see the peak inflationary pulse in the rearview and soft inflation ahead; stay in SFRZ6M7 flatteners."
        trade: "Maintain SFRZ6M7 curve flatteners at 14 bp, target −10 bp, initial stop 20 bp."
    reaction_matrix:
      columns: ["UST 2y / SOFR", "DXY / EURUSD", "SPX / risk"]
      bull:
        label: "Soft / dovish"
        prob: 30
        trigger: "Core ≤ 0.20 m/m"
        cells:
          "UST 2y / SOFR": "2y −7 to −10 bp · <strong>MS SFRZ6/Z7 flattener tgt −10 bp</strong>"
          "DXY / EURUSD":  "DXY −0.5 to −1.0% · EURUSD +60-100 pips"
          "SPX / risk":    "SPX +0.7 to +1.5% · bull-steepener"
      base:
        label: "In-line"
        prob: 50
        trigger: "Core 0.22 m/m (consensus median)"
        cells:
          "UST 2y / SOFR": "2y ±2 bp · curve unchanged"
          "DXY / EURUSD":  "DXY mixed · EURUSD 1.148-1.156"
          "SPX / risk":    "SPX flat ±0.3% · vol crush"
      bear:
        label: "Hot / hawkish"
        prob: 20
        trigger: "Core ≥ 0.27 m/m (BNP \"Energized\")"
        cells:
          "UST 2y / SOFR": "2y +7 to +12 bp · flattener stopped"
          "DXY / EURUSD":  "DXY +0.5 to +1.0% · EURUSD &lt; 1.144"
          "SPX / risk":    "SPX −1.0 to −1.8% · VIX → 24+"
    pdf_embeds:
      - report_id: 4694
        pages: [1]
        eyebrow: "Nomura · Soft-core forecast table"
        look_at: "Fig 1 — full component forecast table with Mar/Apr Actual + May Nomura vs Consensus side-by-side."
      - report_id: 4614
        pages: [1]
        eyebrow: "MS · Trade idea + entry/target/stop"
        look_at: "Key Takeaways — explicit trade size and stop."

