# ── Provider config ───────────────────────────────────────────────

providers:
  citivelocity:
    auth_type: bearer
    base_url: "https://api.citivelocity.com"
    rate_limit:
      requests_per_second: 1
      max_concurrent: 1
      max_tags_per_request: 100
      max_daily_calls: 10000
    token_expiry_seconds: 3600

# ── Swaption Vol Configuration ───────────────────────────────────
# Full RATES.VOL cube: 38,056 tags across 11 currencies.
# Tag formats:
#   ATM/ATM_RFR:       RATES.VOL.{CCY}.{DT}.{QUOTE}.{EXPIRY}.{SWAP}
#   REALIZED/REAL_RFR: RATES.VOL.{CCY}.{DT}.{WINDOW}.{FREQ}.{EXPIRY}.{SWAP}
#   VOL_RATIO/VR_RFR:  RATES.VOL.{CCY}.{DT}.{WINDOW}.{EXPIRY}.{SWAP}

vol:
  currencies: [AUD, CHF, DKK, EUR, GBP, JPY, KRW, NOK, NZD, SEK, USD]
  rfr_currencies: [CHF, EUR, GBP, JPY, USD]

  option_expiries: [1M, 2M, 3M, 6M, 9M, 18M, 1Y, 2Y, 3Y, 4Y, 5Y, 7Y, 10Y, 12Y, 15Y, 20Y, 30Y]
  swap_tenors: [3M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 15Y, 20Y, 30Y]

  atm_quote_types: [BLACK, NORMAL, FWDPREMIUM, PREMIUM]
  atm_rfr_quote_types_default: [FWDPREMIUM, NORMAL, PREMIUM]
  atm_rfr_quote_types_usd: [BLACK, FWDPREMIUM, NORMAL, PREMIUM]

  realized_windows: [1M, 3M, 6M, 1Y]
  realized_freqs: [ANNUAL, DAILY]
  vol_ratio_windows: [1M, 3M, 6M, 1Y]

  # Authoritative tag listing from API exploration (DO NOT re-run).
  # build_vol_tags() reads directly from this cache instead of
  # generating a cartesian product — the API has per-data_type grid
  # variations that a simple cross-join cannot model.
  tag_cache: data/cache/rates/rates_vol_tree.json

  quality:
    ranges:
      ATM.BLACK: { min: 0.1, max: 200.0 }
      ATM.NORMAL: { min: 1.0, max: 500.0 }
      ATM.PREMIUM: { min: 0.0, max: 50.0 }
      ATM.FWDPREMIUM: { min: 0.0, max: 50.0 }
      REALIZED: { min: 0.0, max: 200.0 }
      VOL_RATIO: { min: 0.0, max: 5.0 }
    pct_change_threshold: 50.0
    n_mad: 4.0
    trailing_months: 12
    min_obs: 30

# ── Multi-tenor combos for FWD / CURVES / BFLY ──────────────────
# build_tags() uses these instead of single maturities for multi-leg quote types.
# Each entry is [leg1, leg2, ...] matching the Citi tag structure:
#   FWD:    RATES.OIS.{PREFIX}.FWD.{START}.{END}       (6 parts)
#   CURVES: RATES.OIS.{PREFIX}.CURVES.{SHORT}.{LONG}   (6 parts)
#   BFLY:   RATES.OIS.{PREFIX}.BFLY.{S}.{M}.{L}        (7 parts)

multi_tenor_combos:
  fwd:
    # Forward-starting swaps: {start}x{end}
    # Short-end forwards
    - ["6M", "6M"]
    - ["6M", "1Y"]
    - ["6M", "2Y"]
    - ["1Y", "1Y"]
    - ["1Y", "2Y"]
    - ["1Y", "5Y"]
    - ["1Y", "10Y"]
    # 2Y start
    - ["2Y", "1Y"]
    - ["2Y", "2Y"]
    - ["2Y", "3Y"]
    - ["2Y", "5Y"]
    - ["2Y", "10Y"]
    # 3Y start
    - ["3Y", "2Y"]
    - ["3Y", "3Y"]
    - ["3Y", "5Y"]
    - ["3Y", "7Y"]
    # 5Y start
    - ["5Y", "2Y"]
    - ["5Y", "3Y"]
    - ["5Y", "5Y"]
    - ["5Y", "10Y"]
    - ["5Y", "25Y"]
    # 7Y start
    - ["7Y", "3Y"]
    - ["7Y", "5Y"]
    # 10Y+ start
    - ["10Y", "5Y"]
    - ["10Y", "10Y"]
    - ["10Y", "20Y"]
    - ["15Y", "15Y"]
    - ["20Y", "10Y"]
  spread:
    # Curve spreads (short vs long)
    - ["2Y", "3Y"]
    - ["2Y", "5Y"]
    - ["2Y", "7Y"]
    - ["2Y", "10Y"]
    - ["2Y", "30Y"]
    - ["3Y", "5Y"]
    - ["3Y", "10Y"]
    - ["3Y", "30Y"]
    - ["5Y", "7Y"]
    - ["5Y", "10Y"]
    - ["5Y", "20Y"]
    - ["5Y", "30Y"]
    - ["7Y", "10Y"]
    - ["10Y", "20Y"]
    - ["10Y", "30Y"]
  bfly:
    # Butterflies (short, belly, long)
    - ["2Y", "3Y", "5Y"]
    - ["2Y", "5Y", "10Y"]
    - ["2Y", "10Y", "30Y"]
    - ["3Y", "5Y", "7Y"]
    - ["3Y", "5Y", "10Y"]
    - ["3Y", "7Y", "10Y"]
    - ["5Y", "7Y", "10Y"]
    - ["5Y", "10Y", "30Y"]
    - ["7Y", "10Y", "30Y"]

