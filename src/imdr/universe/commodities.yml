# Commodities Universe Configuration
#
# Covers three sub-products from Citi Velocity:
#   - SPOT: 3 tags (Gold, Silver, WTI)
#   - EIA: 67 tags (US petroleum status report)
#   - IMPLIED_VOL: 1,011 tags (precious metals + oil vol surfaces)

# ── Shared commodity dimension ───────────────────────────────────────

commodities:
  - symbol: XAU
    display_name: Gold
    commodity_class: precious_metal
    spot_tag: COMMODITIES.SPOT.SPOT_GOLD
  - symbol: XAG
    display_name: Silver
    commodity_class: precious_metal
    spot_tag: COMMODITIES.SPOT.SPOT_SILVER
  - symbol: XPT
    display_name: Platinum
    commodity_class: precious_metal
    spot_tag: null
  - symbol: CR_NYM_CL
    display_name: WTI Crude
    commodity_class: energy
    spot_tag: COMMODITIES.SPOT.OIL_PRICE_NYMEX
  - symbol: CR_IPE_BRENT
    display_name: ICE Brent
    commodity_class: energy
    spot_tag: null
  - symbol: NG_HH
    display_name: Henry Hub Natural Gas
    commodity_class: energy
    spot_tag: null          # Citi carries NO gas spot/futures tag -- forecast only
  - symbol: NG_TTF
    display_name: TTF Natural Gas
    commodity_class: energy
    spot_tag: null
  - symbol: NG_JKM
    display_name: JKM LNG
    commodity_class: energy
    spot_tag: null

# ── SPOT ─────────────────────────────────────────────────────────────
# tag → commodity symbol mapping (only commodities with spot_tag)

spot:
  tags:
    COMMODITIES.SPOT.SPOT_GOLD: XAU
    COMMODITIES.SPOT.SPOT_SILVER: XAG
    COMMODITIES.SPOT.OIL_PRICE_NYMEX: CR_NYM_CL

# ── EIA ──────────────────────────────────────────────────────────────
# US Energy Information Administration weekly petroleum status report.
# Published every Wednesday at 10:30 AM ET.

eia:
  tag_template: "COMMODITIES.EIA.EIA_{series}.EIA_{region}"
  series:
    - name: CRUDE_STOCKS
      regions: [TOTAL_US, PADD_I, PADD_II, PADD_III, PADD_IV, PADD_V, CUSHING_OK]
      units: thousands_barrels
    - name: CRUDE_IMPORTS
      regions: [TOTAL_US, PADD_I, PADD_III, PADD_V]
      units: thousands_barrels_day
    - name: CRUDE_EXPORTS
      regions: [TOTAL_US]
      units: thousands_barrels_day
    - name: CRUDE_RUNS
      regions: [TOTAL_US, PADD_I, PADD_II, PADD_III, PADD_IV, PADD_V]
      units: thousands_barrels_day
    - name: DISTILLATE_STOCKS
      regions: [TOTAL_US, PADD_I, PADD_II, PADD_III, PADD_IV, PADD_V]
      units: thousands_barrels
    - name: DISTILLATE_IMPORTS
      regions: [TOTAL_US, PADD_I, PADD_III]
      units: thousands_barrels_day
    - name: DISTILLATE_PRODUCTION
      regions: [TOTAL_US, PADD_I, PADD_II, PADD_III, PADD_IV, PADD_V]
      units: thousands_barrels_day
    - name: DISTILLATES_EXPORT
      regions: [TOTAL_US]
      units: thousands_barrels_day
    - name: GASOLINE_STOCKS
      regions: [TOTAL_US, PADD_I, PADD_II, PADD_III, PADD_IV, PADD_V]
      units: thousands_barrels
    - name: GASOLINE_IMPORTS
      regions: [TOTAL_US, PADD_I, PADD_III]
      units: thousands_barrels_day
    - name: GASOLINE_PRODUCTION
      regions: [TOTAL_US, PADD_I, PADD_II, PADD_III, PADD_IV, PADD_V]
      units: thousands_barrels_day
    - name: GASOLINE_EXPORT
      regions: [TOTAL_US]
      units: thousands_barrels_day
    - name: JET_STOCKS
      regions: [TOTAL_US, PADD_I, PADD_II, PADD_III, PADD_IV, PADD_V]
      units: thousands_barrels
    - name: JET_PRODUCTION
      regions: [TOTAL_US, PADD_I, PADD_II, PADD_III, PADD_IV, PADD_V]
      units: thousands_barrels_day
    - name: HEATING_OIL_STOCKS
      regions: [TOTAL_US, PADD_I]
      units: thousands_barrels
    - name: ULSD_STOCKS
      regions: [TOTAL_US, PADD_I, PADD_II]
      units: thousands_barrels

# ── PRICE FORECAST ───────────────────────────────────────────────────
# Citi Velocity house price forecasts:
#   COMMODITIES.FORECAST.{sector}.{product}.{horizon}.PRICE_FCST.CITI
# The full branch is 29 products x 4 horizons = 115 tags; only the gas
# products are ingested today. Adding a product here is a one-line change --
# it needs a matching dim_commodity `symbol` above.
#
# TWO SHAPES behind one tag family (probed 2026-09-23):
#   RELATIVE (POINT_PRICES.*) -- x is the AS-OF date, published daily. A step
#     function: ~579 points over 2.2y but only 6-9 real changes.
#   ABSOLUTE (QTR / ANNUAL)   -- x is the forecast TARGET period end. A forward
#     curve, CURRENT VINTAGE ONLY; as-of history accrues only as we snapshot.
#
# Units are NOT discoverable -- the Citi metadata endpoint returns
# "Invalid Input" for this whole branch -- so they are declared here.
# TTF is USD/MMBtu, not the EUR/MWh its exchange quotes: across all ten
# revisions TTF sits 1-2 BELOW JKM (USD/MMBtu by definition); in EUR/MWh it
# would be ~3x smaller.

forecast:
  tag_template: "COMMODITIES.FORECAST.{sector}.{product}.{horizon}.PRICE_FCST.CITI"
  vendor_code: citi_velocity

  horizons:
    - code: 0_3M
      type: RELATIVE
      path: POINT_PRICES.0_3M
    - code: 6_12M
      type: RELATIVE
      path: POINT_PRICES.6_12M
    - code: QTR
      type: ABSOLUTE
      path: QTR
    - code: ANNUAL
      type: ABSOLUTE
      path: ANNUAL

  products:
    - product: HH_NGAS
      sector: ENERGY
      symbol: NG_HH
      quote_unit: usd_mmbtu
    - product: TTF_NGAS
      sector: ENERGY
      symbol: NG_TTF
      quote_unit: usd_mmbtu
    - product: JKM_LNG
      sector: ENERGY
      symbol: NG_JKM
      quote_unit: usd_mmbtu

# ── IMPLIED_VOL ──────────────────────────────────────────────────────
# Commodity option implied vol surfaces from Citi Velocity.

vol:
  precious_metals:
    products: [XAU, XAG, XPT]
    tag_template: "COMMODITIES.IMPLIED_VOL.{product}.USD.{strike}.{tenor}"
    strikes:
      standard: [ATM, 10RR, 25RR, 35RR, 10STR, 25STR, 35STR, C10, C25, C35, P10, P25, P35]
      exotic: [SVVSTAR, SVXI, XI]
      xpt_only: [BID, ASK, ATMF]
    tenors:
      XAU: ["ON", 1W, 2W, 1M, 2M, 3M, 6M, 9M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y]
      XAG: ["ON", 1W, 2W, 1M, 2M, 3M, 6M, 9M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y]
      XPT: ["ON", 2D, 4D, 10D, 11D, 12D, 13D, 1W, 2W, 1M, 2M, 3M, 6M, 9M, 18M, 1Y, 2Y, 3Y, 4Y, 5Y, 6Y, 7Y, 8Y, 9Y, 10Y, 15Y, 30Y]

  oil:
    products: [CR_IPE_BRENT, CR_NYM_CL]
    tag_template: "COMMODITIES.IMPLIED_VOL.{product}.ATM.NEARBY{nn}_M"
    contracts: 12  # NEARBY01_M through NEARBY12_M

  quality:
    ranges:
      ATM:
        min: 0.5
        max: 200.0
      10RR:
        min: -50.0
        max: 50.0
      25RR:
        min: -50.0
        max: 50.0
      35RR:
        min: -50.0
        max: 50.0
      10STR:
        min: 0.0
        max: 100.0
      25STR:
        min: 0.0
        max: 100.0
      35STR:
        min: 0.0
        max: 100.0
      C10:
        min: 0.5
        max: 250.0
      C25:
        min: 0.5
        max: 250.0
      C35:
        min: 0.5
        max: 250.0
      P10:
        min: 0.5
        max: 250.0
      P25:
        min: 0.5
        max: 250.0
      P35:
        min: 0.5
        max: 250.0
      SVVSTAR:
        min: -100.0
        max: 100.0
      SVXI:
        min: -100.0
        max: 100.0
      XI:
        min: -100.0
        max: 100.0
      BID:
        min: 0.5
        max: 250.0
      ASK:
        min: 0.5
        max: 250.0
      ATMF:
        min: 0.5
        max: 250.0
