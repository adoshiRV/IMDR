# FX Universe Configuration
# Currencies, classifications, pair conventions, market hours, series, and provider mappings.

currencies:
  g10:
    - USD
    - EUR
    - GBP
    - JPY
    - CHF
    - AUD
    - NZD
    - CAD
    - NOK
    - SEK
    - CNH

  em_ndf:
    - INR
    - KRW
    - TWD
    - THB
    - IDR
    - PHP

  em_deliverable:
    - SGD

classifications:
  # Maps each currency to its classification
  USD: g10
  EUR: g10
  GBP: g10
  JPY: g10
  CHF: g10
  AUD: g10
  NZD: g10
  CAD: g10
  NOK: g10
  SEK: g10
  CNH: g10
  INR: em_ndf
  KRW: em_ndf
  TWD: em_ndf
  THB: em_ndf
  IDR: em_ndf
  PHP: em_ndf
  SGD: em_deliverable

# Pair convention priority (higher = base currency in standard quoting)
pair_priority:
  - EUR
  - GBP
  - AUD
  - NZD
  - USD
  - CAD
  - CHF
  - NOK
  - SEK
  - JPY

market_hours:
  # FX market open hours (UTC) — Sunday 21:00 to Friday 21:00
  open_day: 6   # Sunday
  open_hour: 21
  close_day: 4  # Friday
  close_hour: 21

series:
  SPOT:
    tenor: SPOT
    deal_type: SPOT
  FORWARD_1M:
    tenor: 1M
    deal_type: FORWARD
  NDF_1M:
    tenor: 1M
    deal_type: NDF

providers:
  bidfx:
    # Maps classification to which series to fetch
    g10:
      - SPOT
      - FORWARD_1M
    em_ndf:
      - SPOT
      - NDF_1M
    em_deliverable:
      - SPOT
      - FORWARD_1M
    auth_type: basic
    base_url: "https://data.app.bidfx.com/api/price/historical/v1/fx"

  citivelocity:
    g10:
      - SPOT
    em_ndf:
      - SPOT
    em_deliverable:
      - SPOT
    auth_type: bearer
    base_url: ""

# Per-symbol hard bounds — prices should NEVER fall outside these ranges.
# Used by quality checks and ingest validation to flag corrupt data.
expected_ranges:
  AUDUSD: { min: 0.3, max: 3.0 }
  EURUSD: { min: 0.3, max: 3.0 }
  GBPUSD: { min: 0.3, max: 3.0 }
  NZDUSD: { min: 0.3, max: 3.0 }
  USDCAD: { min: 0.5, max: 2.5 }
  USDCHF: { min: 0.5, max: 2.5 }
  USDSGD: { min: 0.5, max: 2.5 }
  USDCNH: { min: 5.0, max: 9.0 }
  USDJPY: { min: 60.0, max: 200.0 }
  USDINR: { min: 50.0, max: 100.0 }
  USDKRW: { min: 800.0, max: 1600.0 }
  USDNOK: { min: 5.0, max: 15.0 }
  USDSEK: { min: 5.0, max: 15.0 }
  USDPHP: { min: 40.0, max: 70.0 }
  USDTHB: { min: 25.0, max: 45.0 }
  USDTWD: { min: 25.0, max: 40.0 }
  USDIDR: { min: 10000.0, max: 20000.0 }
