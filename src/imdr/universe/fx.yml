# FX Universe Configuration
# Currencies, classifications, pair conventions, market hours, series, and provider mappings.

currencies:
  g10:
    - USD
    - EUR
    - GBP
    - JPY
    - CHF
    - AUD
    - NZD
    - CAD
    - NOK
    - SEK
    - CNH

  em_ndf:
    - INR
    - KRW
    - TWD
    - THB
    - IDR
    - PHP
    - MYR

  em_deliverable:
    - SGD
    - HKD

classifications:
  # Maps each currency to its classification
  USD: g10
  EUR: g10
  GBP: g10
  JPY: g10
  CHF: g10
  AUD: g10
  NZD: g10
  CAD: g10
  NOK: g10
  SEK: g10
  CNH: g10
  INR: em_ndf
  KRW: em_ndf
  TWD: em_ndf
  THB: em_ndf
  IDR: em_ndf
  PHP: em_ndf
  MYR: em_ndf
  SGD: em_deliverable
  HKD: em_deliverable
  MXN: em_deliverable
  PLN: em_deliverable
  ILS: em_deliverable

# Pair convention priority (higher = base currency in standard quoting)
pair_priority:
  - EUR
  - GBP
  - AUD
  - NZD
  - USD
  - CAD
  - CHF
  - NOK
  - SEK
  - JPY

market_hours:
  # FX market open hours (UTC) — Sunday 21:00 to Friday 21:00
  open_day: 6   # Sunday
  open_hour: 21
  close_day: 4  # Friday
  close_hour: 21

series:
  SPOT:
    tenor: SPOT
    deal_type: SPOT
  FORWARD_1M:
    tenor: 1M
    deal_type: FORWARD
  NDF_1M:
    tenor: 1M
    deal_type: NDF

providers:
  bidfx:
    # Maps classification to which series to fetch
    g10:
      - SPOT
      - FORWARD_1M
    em_ndf:
      - SPOT
      - NDF_1M
    em_deliverable:
      - SPOT
      - FORWARD_1M
    auth_type: basic
    base_url: "https://data.app.bidfx.com/api/price/historical/v1/fx"

  citivelocity:
    g10:
      - SPOT
    em_ndf:
      - SPOT
    em_deliverable:
      - SPOT
    auth_type: bearer
    base_url: ""

vol:
  # Pairs to track — uses Citi's ccy ordering (not market convention)
  pairs:
    # G10
    - [EUR, USD]
    - [GBP, USD]
    - [USD, JPY]
    - [AUD, USD]
    - [NZD, USD]
    - [USD, CAD]
    - [USD, CHF]
    - [USD, NOK]
    - [USD, SEK]
    - [USD, CNH]
    # EM NDF
    - [USD, INR]
    - [USD, KRW]
    - [USD, TWD]
    - [USD, THB]
    - [USD, IDR]
    - [USD, PHP]
    # EM Deliverable
    - [USD, SGD]
    - [USD, HKD]

  strikes:
    - ATM
    - 25RR
    - 10RR
    - 25STR
    - 10STR
    - STRIKE_C25
    - STRIKE_P25
    - STRIKE_C10
    - STRIKE_P10
    - STRIKE_C35
    - STRIKE_P35

  tenors:
    - "ON"
    - 1W
    - 2W
    - 1M
    - 2M
    - 3M
    - 6M
    - 9M
    - 1Y
    - 2Y
    - 3Y
    - 5Y
    - 7Y
    - 10Y

  # ATM has 3 leaf types; all others have only IMPLIED
  vol_types:
    ATM: [IMPLIED, REALISED, SPREAD]
    _default: [IMPLIED]

  tag_template: "FX.VOL.{ccy1}.{ccy2}.{strike}.{tenor}.{vol_type}.CITI"

  # Quality check configuration for vol surface data
  quality:
    # Per strike+vol_type hard ranges (vol in percentage points)
    ranges:
      ATM:
        IMPLIED: { min: 0.5, max: 80.0 }
        REALISED: { min: 0.5, max: 80.0 }
        SPREAD: { min: -30.0, max: 30.0 }
      25RR:
        IMPLIED: { min: -20.0, max: 20.0 }
      10RR:
        IMPLIED: { min: -30.0, max: 30.0 }
      25STR:
        IMPLIED: { min: 0.01, max: 25.0 }    # Must be positive (convex smile invariant)
      10STR:
        IMPLIED: { min: 0.01, max: 40.0 }    # Must be positive (convex smile invariant)
      STRIKE_C25:
        IMPLIED: { min: 0.5, max: 80.0 }
      STRIKE_P25:
        IMPLIED: { min: 0.5, max: 80.0 }
      STRIKE_C10:
        IMPLIED: { min: 0.5, max: 80.0 }
      STRIKE_P10:
        IMPLIED: { min: 0.5, max: 80.0 }
      STRIKE_C35:
        IMPLIED: { min: 0.5, max: 80.0 }
      STRIKE_P35:
        IMPLIED: { min: 0.5, max: 80.0 }
    # Absolute change thresholds for signed/small-magnitude strikes.
    # Percentage change is meaningless when values cross zero (RR) or are
    # near-zero (STR short tenors).  These strikes use absolute vol-point
    # thresholds instead of the percentage threshold in pipelines.yml.
    abs_change_thresholds:
      25RR: 2.0     # vol points — typical daily move ~0.1–0.5
      10RR: 3.0     # wider wings, larger moves normal
      25STR: 1.0    # small positive values, % is misleading
      10STR: 2.0    # same, wider wing
    # Absolute change thresholds for vol_types where percentage change is
    # meaningless (SPREAD crosses zero, REALISED resets weekly).
    abs_change_vol_types:
      SPREAD: 4.0     # vol points — ATM IMPLIED minus REALISED, crosses zero
      REALISED: 5.0   # vol points — weekly rolling window causes large pct swings
    # Percentage-change thresholds by ccy_class × tenor.
    # Short tenors and EM pairs have higher vol-of-vol; long-dated G10 is stable.
    # Falls back to pipelines.yml pct_threshold (30.0) for unmapped combos.
    pct_thresholds:
      g10:
        "ON": 90.0
        1W: 75.0
        2W: 65.0
        1M: 60.0
        2M: 50.0
        3M: 45.0
        6M: 35.0
        9M: 30.0
        1Y: 25.0
        2Y: 20.0
        3Y: 19.0
        5Y: 18.0
        7Y: 16.0
        10Y: 15.0
      em_ndf:
        "ON": 120.0
        1W: 100.0
        2W: 85.0
        1M: 80.0
        2M: 65.0
        3M: 55.0
        6M: 45.0
        9M: 40.0
        1Y: 35.0
        2Y: 30.0
        3Y: 27.0
        5Y: 25.0
        7Y: 22.0
        10Y: 20.0
      em_deliverable:
        "ON": 100.0
        1W: 85.0
        2W: 75.0
        1M: 70.0
        2M: 55.0
        3M: 50.0
        6M: 40.0
        9M: 35.0
        1Y: 30.0
        2Y: 25.0
        3Y: 22.0
        5Y: 20.0
        7Y: 19.0
        10Y: 18.0
    # Statistical params (n_mad, trailing_months, pct_threshold) are in
    # pipelines.yml under fx.vol.cleaning — single source of truth for
    # both quality checks and cleaning rules.

# ─────────────────────────────────────────────────────────────────────────
# FX Rate pipeline — Citi Velocity daily EOD spot + forward outrights + points
# See docs/fx/fx_rate_schema.md and docs/fx/fx_rate_operations.md
# ─────────────────────────────────────────────────────────────────────────
fx_rate:
  # Pair ordering follows Citi's convention:
  # - EUR, GBP, AUD, NZD are non-USD base on Citi
  # - Everything else is USD-base
  pairs:
    # G10 non-USD base
    - [EUR, USD]
    - [GBP, USD]
    - [AUD, USD]
    - [NZD, USD]
    # G10 USD base
    - [USD, JPY]
    - [USD, CHF]
    - [USD, CAD]
    - [USD, NOK]
    - [USD, SEK]
    - [USD, CNH]
    # EM deliverable / pegged
    - [USD, HKD]
    - [USD, SGD]
    # Asia EM
    - [USD, KRW]
    - [USD, TWD]
    - [USD, THB]
    - [USD, IDR]
    - [USD, PHP]
    - [USD, INR]
    - [USD, MYR]
    # LatAm / EMEA deliverable (BBG coverage)
    - [USD, MXN]
    - [USD, PLN]
    - [USD, ILS]
    # Onshore EM variants — BBG R-pipeline has these; Citi does not.
    # Listed in `bbg_only_pairs` below so the Citi fetcher skips them.
    - [USD, CNY]
    - [USD, CNO]
    - [USD, MYO]
    - [USD, IDO]

  # Pairs without forward outrights on Citi — ingest SPOT only
  spot_only_pairs: []

  # Pairs in `pairs` above that are BBG-only (no Citi tag analog).
  # Citi extractor + tag-builder skip these; BBG extractor includes them.
  bbg_only_pairs:
    - [USD, CNY]
    - [USD, CNO]
    - [USD, MYO]
    - [USD, IDO]

  # Curated tenor grid: spot + dense 0–1Y grid + 3 long curve points
  # 0–1Y dense coverage matches dashboards that interpolate forward curves.
  tenors:
    - SPOT
    - "ON"     # quoted to prevent YAML 1.1 from parsing as boolean True
    - TN
    - SN
    - 1W
    - 2W
    - 3W
    - 1M
    - 2M
    - 3M
    - 4M
    - 5M
    - 6M
    - 7M
    - 8M
    - 9M
    - 10M
    - 11M
    - 1Y
    - 2Y
    - 5Y
    - 10Y

  spot_tag_template:     "FX.SPOT.{ccy1}.{ccy2}.CITI"
  outright_tag_template: "FX.FORWARD.FWD_OUTRIGHT.{ccy1}.{ccy2}.{tenor}.CITI"
  points_tag_template:   "FX.FORWARD.FWD_POINT.{ccy1}.{ccy2}.{tenor}.CITI"

  # Per-pair hard bounds (pair_code = BASE + QUOTE, compact).
  # Rates should NEVER fall outside these; used by quality checks.
  expected_ranges:
    EURUSD: {min: 0.5,   max: 2.0}
    GBPUSD: {min: 0.5,   max: 2.5}
    AUDUSD: {min: 0.3,   max: 1.5}
    NZDUSD: {min: 0.3,   max: 1.5}
    USDJPY: {min: 60,    max: 250}
    USDCHF: {min: 0.5,   max: 2.0}
    USDCAD: {min: 0.8,   max: 2.0}
    USDNOK: {min: 3.0,   max: 15.0}
    USDSEK: {min: 3.0,   max: 15.0}
    USDCNH: {min: 5.0,   max: 10.0}
    USDHKD: {min: 7.70,  max: 7.90}
    USDSGD: {min: 0.8,   max: 2.0}
    USDKRW: {min: 800,   max: 2000}
    USDTWD: {min: 20,    max: 45}
    USDTHB: {min: 20,    max: 60}
    USDIDR: {min: 5000,  max: 25000}
    USDPHP: {min: 30,    max: 80}
    USDINR: {min: 40,    max: 120}
    USDMYR: {min: 2.5,   max: 6.0}
    USDMXN: {min: 10,    max: 30}
    USDPLN: {min: 2.0,   max: 6.0}
    USDILS: {min: 2.5,   max: 5.0}
    # Onshore EM variants — same broad ranges as offshore counterparts
    USDCNY: {min: 5.0,   max: 10.0}
    USDCNO: {min: 5.0,   max: 10.0}
    USDMYO: {min: 2.5,   max: 6.0}
    USDIDO: {min: 5000,  max: 25000}

# Per-symbol hard bounds — prices should NEVER fall outside these ranges.
# Used by quality checks and ingest validation to flag corrupt data.
expected_ranges:
  AUDUSD: { min: 0.3, max: 3.0 }
  EURUSD: { min: 0.3, max: 3.0 }
  GBPUSD: { min: 0.3, max: 3.0 }
  NZDUSD: { min: 0.3, max: 3.0 }
  USDCAD: { min: 0.5, max: 2.5 }
  USDCHF: { min: 0.5, max: 2.5 }
  USDSGD: { min: 0.5, max: 2.5 }
  USDCNH: { min: 5.0, max: 9.0 }
  USDJPY: { min: 60.0, max: 200.0 }
  USDINR: { min: 50.0, max: 100.0 }
  USDKRW: { min: 800.0, max: 1600.0 }
  USDNOK: { min: 5.0, max: 15.0 }
  USDSEK: { min: 5.0, max: 15.0 }
  USDPHP: { min: 40.0, max: 70.0 }
  USDTHB: { min: 20.0, max: 60.0 }
  USDTWD: { min: 25.0, max: 40.0 }
  USDIDR: { min: 10000.0, max: 20000.0 }
