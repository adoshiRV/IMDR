pipelines:
  fx.spot_rates:
    domain: fx
    target_schema: fx
    target_table: fx_spot_rates
    date_column: rate_date
    unique_columns:
      - base_currency
      - quote_currency
      - rate_date
    required_columns:
      - mid
      - base_currency
      - quote_currency
    health_checks:
      row_count_min: 5
      max_staleness_hours: 24
      value_ranges:
        mid:
          min: 0.0001
          max: 10000.0
    sources:
      bidfx:
        type: rest
        # API details to be filled in
      citivelocity:
        type: rest
        # API details to be filled in

  fx.ohlc:
    domain: fx
    target_schema: fx
    target_table: fact_ohlc
    date_column: ts
    unique_columns:
      - ts
      - symbol
      - series
      - tenor
    required_columns:
      - open_px
      - high_px
      - low_px
      - close_px
      - mid_px
      - bid
      - ask
      - n_ticks
    health_checks:
      row_count_min: 10
      max_staleness_hours: 2
      value_ranges:
        close_px:
          min: 0.0001
          max: 100000.0
        mid_px:
          min: 0.0001
          max: 100000.0
    cleaning:
      n_mad: 6.0
      trailing_months: 3
      pct_threshold: 5.0
      min_obs: 100
    sources:
      bidfx:
        type: rest
        auth: basic
      citivelocity:
        type: rest
        auth: bearer

  fx.vol:
    domain: fx
    target_schema: fx
    target_table: fact_vol
    date_column: obs_date
    unique_columns:
      - pair_id
      - obs_date
      - strike
      - tenor
      - vol_type
    required_columns:
      - pair_id
      - obs_date
      - strike
      - tenor
      - vol_type
      - value
    health_checks:
      row_count_min: 50
      max_staleness_hours: 48
      # value_ranges derived from fx.yml per-(strike,vol_type) ranges at runtime
    cleaning:
      n_mad: 4.0
      trailing_months: 12
      pct_threshold: 30.0
      min_obs: 30
    sources:
      citivelocity:
        type: rest
        auth_type: bearer

  rates.vol:
    domain: rates
    target_schema: rates
    target_table: fact_swaption_vol
    date_column: obs_date
    unique_columns:
      - surface_id
      - obs_date
      - option_expiry
      - swap_tenor
    required_columns:
      - surface_id
      - obs_date
      - option_expiry
      - swap_tenor
      - value
    health_checks:
      row_count_min: 50
      max_staleness_hours: 48
    cleaning:
      n_mad: 4.0
      trailing_months: 12
      pct_threshold: 50.0
      min_obs: 30
    sources:
      citivelocity:
        type: rest
        auth_type: bearer

  rates.historical:
    domain: rates
    target_schema: rates
    target_table: fact_observation
    date_column: ts
    default_quotes:
      - par
      - spread
      - fwd
      - bfly
      - ssw
      - rc
    unique_columns:
      - curve_id
      - ts
      - quote
      - tenor
    required_columns:
      - curve_id
      - ts
      - quote
      - tenor
      - value
    health_checks:
      row_count_min: 1
      max_staleness_hours: 48
    cleaning:
      n_mad: 4.0
      trailing_months: 12
      pct_threshold: 30.0
      min_obs: 30
    sources:
      citivelocity:
        type: rest
        auth: bearer

  commodities.spot:
    domain: commodities
    target_schema: commodities
    target_table: fact_spot
    date_column: obs_date
    unique_columns:
      - commodity_id
      - obs_date
    required_columns:
      - commodity_id
      - obs_date
      - price
    health_checks:
      row_count_min: 1
      max_staleness_hours: 48
      value_ranges:
        price:
          min: 0.01
          max: 100000.0
    sources:
      citivelocity:
        type: rest
        auth_type: bearer

  commodities.eia:
    domain: commodities
    target_schema: commodities
    target_table: fact_eia
    date_column: obs_date
    unique_columns:
      - eia_series_id
      - obs_date
    required_columns:
      - eia_series_id
      - obs_date
      - stat_value
    health_checks:
      row_count_min: 10
      max_staleness_hours: 192
    sources:
      citivelocity:
        type: rest
        auth_type: bearer

  commodities.vol:
    domain: commodities
    target_schema: commodities
    target_table: fact_implied_vol
    date_column: obs_date
    unique_columns:
      - commodity_id
      - obs_date
      - strike
      - tenor
    required_columns:
      - commodity_id
      - obs_date
      - strike
      - tenor
      - vol
    health_checks:
      row_count_min: 50
      max_staleness_hours: 48
    cleaning:
      n_mad: 4.0
      trailing_months: 12
      pct_threshold: 40.0
      min_obs: 30
    sources:
      citivelocity:
        type: rest
        auth_type: bearer
