pipelines:
  fx.ohlc:
    domain: fx
    target_schema: fx
    target_table: fact_ohlc
    date_column: ts
    unique_columns:
      - ts
      - symbol
      - series
      - tenor
    required_columns:
      - open_px
      - high_px
      - low_px
      - close_px
      - mid_px
      - bid
      - ask
      - n_ticks
    health_checks:
      row_count_min: 10
      max_staleness_hours: 2
      value_ranges:
        close_px:
          min: 0.0001
          max: 100000.0
        mid_px:
          min: 0.0001
          max: 100000.0
    cleaning:
      n_mad: 6.0
      trailing_months: 3
      pct_threshold: 5.0
      min_obs: 100

  fx.citi_rate:
    domain: fx
    target_schema: fx
    target_table: fact_fx_rate
    date_column: obs_date
    unique_columns:
      - pair_id
      - vendor_id
      - frequency_id
      - obs_ts
      - tenor
    required_columns:
      - pair_id
      - vendor_id
      - frequency_id
      - obs_ts
      - obs_date
      - tenor
      - mid_rate
    health_checks:
      row_count_min: 180           # 19 pairs × 11 tenors = 209; allow margin for holidays
      max_staleness_hours: 48
      value_ranges:
        mid_rate:
          min: 0.00001
          max: 100000.0
    cleaning:
      n_mad: 5.0
      trailing_months: 6
      pct_threshold: 10.0          # daily EOD — looser than hourly
      min_obs: 30

  fx.vol:
    domain: fx
    target_schema: fx
    target_table: fact_vol
    date_column: obs_date
    unique_columns:
      - pair_id
      - obs_date
      - strike
      - tenor
      - vol_type
    required_columns:
      - pair_id
      - obs_date
      - strike
      - tenor
      - vol_type
      - value
    health_checks:
      row_count_min: 50
      max_staleness_hours: 48
      # value_ranges derived from fx.yml per-(strike,vol_type) ranges at runtime
    cleaning:
      n_mad: 4.0
      trailing_months: 12
      pct_threshold: 30.0
      min_obs: 30

  rates.vol:
    domain: rates
    target_schema: rates
    target_table: fact_swaption_vol
    date_column: obs_date
    unique_columns:
      - surface_id
      - obs_date
      - option_expiry
      - swap_tenor
    required_columns:
      - surface_id
      - obs_date
      - option_expiry
      - swap_tenor
      - value
    health_checks:
      row_count_min: 50
      max_staleness_hours: 48
    cleaning:
      n_mad: 4.0
      trailing_months: 12
      pct_threshold: 50.0
      min_obs: 30

  rates.skew:
    domain: rates
    target_schema: rates
    target_table: fact_swaption_skew
    date_column: obs_date
    unique_columns:
      - surface_id
      - obs_date
      - swap_tenor
      - strike_offset
    required_columns:
      - surface_id
      - vendor_id
      - obs_date
      - swap_tenor
      - strike_offset
      - vol
    health_checks:
      row_count_min: 50
      max_staleness_hours: 720   # manual Excel import, not daily automated
    cleaning:
      n_mad: 4.0
      trailing_months: 12
      pct_threshold: 50.0
      min_obs: 30

  rates.historical:
    domain: rates
    target_schema: rates
    target_table: fact_observation
    date_column: ts
    default_quotes:
      - par
      - spread
      - fwd
      - bfly
      - ssw
      - rc
    unique_columns:
      - curve_id
      - ts
      - quote
      - tenor
    required_columns:
      - curve_id
      - ts
      - quote
      - tenor
      - value
    health_checks:
      row_count_min: 1
      max_staleness_hours: 48
    cleaning:
      n_mad: 4.0
      trailing_months: 12
      pct_threshold: 30.0
      min_obs: 30

  rates.bench_rates:
    domain: rates
    target_schema: rates
    target_table: fact_bench_rates
    date_column: obs_date
    unique_columns:
      - cb_id
      - obs_date
    required_columns:
      - cb_id
      - vendor_id
      - obs_date
      - rate
    health_checks:
      row_count_min: 5
      max_staleness_hours: 48
      value_ranges:
        rate:
          min: -2.0
          max: 20.0

  commodities.spot:
    domain: commodities
    target_schema: commodities
    target_table: fact_spot
    date_column: obs_date
    unique_columns:
      - commodity_id
      - obs_date
    required_columns:
      - commodity_id
      - obs_date
      - price
    health_checks:
      row_count_min: 1
      max_staleness_hours: 48
      value_ranges:
        price:
          min: 0.01
          max: 100000.0

  commodities.eia:
    domain: commodities
    target_schema: commodities
    target_table: fact_eia
    date_column: obs_date
    unique_columns:
      - eia_series_id
      - obs_date
    required_columns:
      - eia_series_id
      - obs_date
      - stat_value
    health_checks:
      row_count_min: 10
      max_staleness_hours: 192

  commodities.vol:
    domain: commodities
    target_schema: commodities
    target_table: fact_implied_vol
    date_column: obs_date
    unique_columns:
      - commodity_id
      - obs_date
      - strike
      - tenor
    required_columns:
      - commodity_id
      - obs_date
      - strike
      - tenor
      - vol
    health_checks:
      row_count_min: 50
      max_staleness_hours: 48
    cleaning:
      n_mad: 4.0
      trailing_months: 12
      pct_threshold: 40.0
      min_obs: 30

  # ── Equity domain ──────────────────────────────────────────────────

  equity.index:
    domain: equities
    target_schema: equities
    target_table: fact_index_level
    date_column: obs_date
    unique_columns:
      - index_id
      - obs_date
    required_columns:
      - index_id
      - obs_date
      - close_level
    health_checks:
      row_count_min: 5
      max_staleness_hours: 48
      value_ranges:
        close_level:
          min: 1.0
          max: 100000.0

  equity.vix:
    domain: equities
    target_schema: equities
    target_table: fact_vix
    date_column: obs_date
    unique_columns:
      - ticker
      - obs_date
    required_columns:
      - ticker
      - obs_date
      - close_level
    health_checks:
      row_count_min: 3
      max_staleness_hours: 48
      value_ranges:
        close_level:
          min: 1.0
          max: 150.0
